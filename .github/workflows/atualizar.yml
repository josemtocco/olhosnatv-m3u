name: Atualizar playlist M3U

on:
  schedule:
    # A cada 6 horas, em minuto 17.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-m3u
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Atualizar playlist
        env:
          SOURCE_URL: https://www.olhosnatv.com.br/
          OUTPUT_FILE: lista.m3u
          STATE_FILE: canais.json
          REQUEST_TIMEOUT: "20"
          MAX_WORKERS: "8"
          CHECK_STREAMS: "false"
        run: python atualizar.py

      - name: Verificar alterações
        id: changes
        run: |
          if git diff --quiet -- lista.m3u canais.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista.m3u canais.json
          git commit -m "chore: atualizar playlist"
          git push
